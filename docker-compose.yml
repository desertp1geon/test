
services:

  postgres:
    image: postgres:17-alpine
    container_name: keycloak-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres

      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      REGISTRY_DB_USER: ${REGISTRY_DB_USER}
      REGISTRY_DB_PASSWORD: ${REGISTRY_DB_PASSWORD}

      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

      - ./infrastructure/postgres/init/01-init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d postgres
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    build:
      context: .
      dockerfile: Dockerfile

    image: custom-keycloak:26.8.1

    container_name: keycloak-server

    restart: unless-stopped

    command:
      - start-dev
      - --http-enabled=true
      - --hostname-strict=false
      - --import-realm

    environment:
      REGISTRY_DB_URL: jdbc:postgresql://postgres:5432/identity_registry
      REGISTRY_DB_USER: ${REGISTRY_DB_USER}
      REGISTRY_DB_PASSWORD: ${REGISTRY_DB_PASSWORD}
      IDENTITY_HMAC_KEY_VERSION: ${IDENTITY_HMAC_KEY_VERSION}
      IDENTITY_HMAC_KEY_BASE64: ${IDENTITY_HMAC_KEY_BASE64}

      KC_DB: postgres

      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_HEALTH_ENABLED: true

    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import:ro

    ports:
      - "127.0.0.1:${KEYCLOAK_PORT}:8080"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: keycloak_postgres_data

